[metadata]
name = cogp-support
description = Standalone coordination and execution-prediction experiment code

[options]
packages = find_namespace:
python_requires = >=3.10
install_requires =
    numpy>=1.24
    torch>=2.5
    gymnasium>=0.29
    stable-baselines3>=2.4
    scipy>=1.11
    matplotlib>=3.8
    psutil>=5.9
    cloudpickle>=3.0

[options.packages.find]
include = cogp*

[options.entry_points]
console_scripts =
    cogp = cogp.__main__:main
